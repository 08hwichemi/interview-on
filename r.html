<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 타학교 면접 평가서 — 선생님 화면의 QR 로 엽니다(other-school.js).
       주소 # 뒤의 긴 열쇠로 로그인 없이 하루만 열립니다. 검색에 안 걸리게, 주소가 다른 데로 안 새게 막아 둡니다 -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#18181B">
  <title>면접 평가서 · 면접ON</title>
  <link rel="icon" href="assets/icon-192.png?v=2026-10-19.2">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/teacher.css?v=2026-10-19.2">
  <link rel="stylesheet" href="assets/css/report.css?v=2026-10-19.2">
  <style>
    .rwrap{max-width:860px;margin:0 auto;padding:16px 16px 40px}
    .rtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}
    .rtop .brand{font-weight:800;font-size:17px;letter-spacing:-.02em}
    .rtop .brand em{font-style:normal;color:var(--ink-3)}
    .rsave{display:flex;flex-direction:column;gap:8px;margin:0 0 16px;padding:14px;border-radius:var(--r);
      background:var(--surface-2);border:1px solid var(--line)}
    .rsave .btn{width:100%;padding:13px;font-size:15px}
    .rsave .small{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin:0}
    .rsave .linkbtn{align-self:center;font-size:12.5px}
    .rmsg{padding:28px 6px;text-align:center;color:var(--ink-2);line-height:1.8}
    .rmsg b{color:var(--ink)}
  </style>
</head>
<body>
  <main class="rwrap">
    <div class="rtop">
      <span class="brand">면접<em>ON</em></span>
      <span class="pill ok" id="r-badge" hidden>모의면접 평가서</span>
    </div>

    <div class="panel pad">
      <div class="rmsg" id="r-msg">평가서를 불러오는 중...</div>

      <div class="rsave" id="r-save" hidden>
        <button class="btn solid" id="r-pdf" onclick="otherPagePdf()">📄 PDF로 저장</button>
        <p class="small" id="r-until"></p>
        <button class="linkbtn" onclick="otherPagePrint()">PDF 저장이 안 되면 — 인쇄창으로 저장</button>
      </div>

      <div id="r-body" class="report"></div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
  <script src="assets/js/config.js?v=2026-10-19.2"></script>
  <script src="assets/js/report.js?v=2026-10-19.2"></script>
  <script src="assets/js/other-report-page.js?v=2026-10-19.2"></script>
</body>
</html>
