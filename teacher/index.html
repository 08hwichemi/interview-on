<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>면접ON 교사</title>
  <link rel="icon" href="../assets/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/teacher.css">
</head>
<body>

<!-- 새 판이 올라오면 이 띠가 뜹니다 (version.txt 와 BUILD_ID 를 견줍니다) -->
<div id="updateBar" class="updatebar" hidden>
  <span>새 버전이 올라왔습니다. 새로고침하면 최신 화면으로 보입니다.</span>
  <button type="button" id="updateReload">새로고침</button>
</div>

<div id="gate">
  <div class="spinner" id="gate-spinner"></div>
  <p id="gate-msg">확인 중...</p>
  <div id="gate-fail" hidden>
    <p class="gate-detail" id="gate-detail"></p>
    <div class="gate-actions">
      <button class="btn solid" onclick="location.reload()">다시 시도</button>
      <button class="ghost" onclick="gateRelogin()">로그인 화면으로</button>
    </div>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand">면접<em>ON</em></div>
      <span class="yr">교사</span>
      <span class="grow"></span>
      <span class="ub-name" id="t-user-name"></span>
      <span class="ub-role" id="t-user-role"></span>
      <button class="ghost" onclick="teacherLogout()">로그아웃</button>
    </div>
  </header>

  <main class="wrap">

    <div class="tabs" role="tablist">
      <button class="tab" id="tab-student" role="tab" aria-selected="true"
              onclick="setRosterMode('student')">학생 명단</button>
      <button class="tab" id="tab-teacher" role="tab" aria-selected="false"
              onclick="setRosterMode('teacher')">교사 명단</button>
    </div>

    <!-- ── 추가 등록 ── -->
    <section class="panel pad">
      <p class="sec" id="add-title">학생 추가 등록</p>
      <p class="hint" id="add-hint"></p>

      <!-- 엑셀 파일 (학생만) -->
      <div id="excel-box">
        <div class="btnrow">
          <input type="file" id="excel-file" accept=".xlsx,.xls,.csv" hidden onchange="readExcelFile(event)">
          <button class="btn" onclick="document.getElementById('excel-file').click()">엑셀 파일 선택</button>
          <select id="grade-pick" style="width:auto" title="엑셀에 학년 칸이 없을 때 쓸 학년">
            <option value="1">1학년</option>
            <option value="2">2학년</option>
            <option value="3" selected>3학년</option>
          </select>
          <span class="hint" id="excel-name" style="margin:0;align-self:center"></span>
        </div>
      </div>

      <textarea id="paste-box" spellcheck="false"></textarea>

      <button class="btn solid wide" id="btn-create" onclick="createAccounts()">등록하기</button>

      <div class="note bad" id="add-problems" hidden></div>
      <div class="note info" id="add-result" hidden></div>
    </section>

    <!-- ── 등록된 명단 ── -->
    <section class="panel pad">
      <p class="sec" id="roster-title">등록된 학생 명단</p>
      <div class="chips" id="class-chips" hidden></div>
      <div id="roster-list"></div>
    </section>

  </main>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/update-bar.js"></script>
<script src="../assets/js/teacher-roster.js"></script>
<script>
  // 확인이 끝나지 않으면 "확인 중..." 이 영영 돌기만 합니다.
  // 왜 멈췄는지 화면에 보여줍니다.
  function gateFail(msg, detail) {
    clearTimeout(gateTimer);
    document.getElementById('gate-spinner').hidden = true;
    document.getElementById('gate-msg').textContent = msg;
    document.getElementById('gate-detail').textContent = detail || '';
    document.getElementById('gate-fail').hidden = false;
  }

  // 저장된 로그인 정보가 깨졌을 때 빠져나가는 길
  async function gateRelogin() {
    try { await sb.auth.signOut(); } catch (e) { /* 이미 못 쓰는 상태면 그냥 넘어갑니다 */ }
    try { localStorage.clear(); } catch (e) { /* 사생활 보호 모드면 막힐 수 있습니다 */ }
    location.replace('../');
  }

  var gateTimer = setTimeout(function () {
    gateFail('서버가 답하지 않습니다.',
      '10초를 기다렸지만 응답이 없습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');
  }, 10000);

  // 이 페이지는 선생님·관리자 전용입니다.
  // 로그인하지 않았거나 학생이면 학생 앱으로 돌려보냅니다.
  // (서버의 RLS 가 진짜 방어선이고, 이건 화면을 잘못 연 사람을 안내하는 용도입니다)
  (async function guard() {
    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      gateFail('앱을 불러오지 못했습니다.',
        'supabase 라이브러리(cdn.jsdelivr.net)를 못 읽었습니다. 인터넷 연결을 확인해 주세요.');
      return;
    }
    var ready = false;
    try { ready = !!sb; } catch (e) { ready = false; }
    if (!ready) {
      gateFail('앱을 불러오지 못했습니다.',
        'assets/js/config.js 를 못 읽었습니다. 파일 경로를 확인해 주세요.');
      return;
    }

    const { data: { session }, error: sessionErr } = await sb.auth.getSession();
    if (sessionErr) { gateFail('로그인 정보를 읽지 못했습니다.', sessionErr.message); return; }
    if (!session) { clearTimeout(gateTimer); location.replace('../'); return; }

    const { data: profile, error: profileErr } = await sb
      .from('profiles')
      .select('name, login_id, role')
      .eq('id', session.user.id)
      .maybeSingle();

    if (profileErr) {
      gateFail('계정 정보를 읽지 못했습니다.',
        profileErr.message + ' — 서버의 profiles 권한(RLS) 설정을 확인해야 할 수 있습니다.');
      return;
    }

    if (!profile || profile.role === 'student') { clearTimeout(gateTimer); location.replace('../'); return; }

    clearTimeout(gateTimer);

    isAdmin = profile.role === 'admin';
    document.getElementById('t-user-name').textContent = profile.name || profile.login_id || '';
    document.getElementById('t-user-role').textContent = isAdmin ? '관리자' : '교사';

    // 교사 계정은 관리자만 만들 수 있습니다 (서버도 같은 기준으로 막습니다).
    if (!isAdmin) document.getElementById('tab-teacher').hidden = true;

    document.getElementById('gate').hidden = true;
    document.getElementById('app').hidden = false;

    setRosterMode('student');
  })().catch(function (e) {
    console.error(e);
    var detail = String((e && e.message) || e);
    if (document.getElementById('app').hidden) gateFail('확인 중 문제가 생겼습니다.', detail);
    else if (typeof toast === 'function') toast('명단을 불러오지 못했습니다: ' + detail, 'bad');
  });

  async function teacherLogout() {
    await sb.auth.signOut();
    location.replace('../');
  }
</script>
</body>
</html>
