<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>면접ON 교사</title>
  <link rel="icon" href="../assets/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../assets/css/teacher.css">
</head>
<body>

<div id="updateBar" class="updatebar" hidden>
  <span>새 버전이 올라왔습니다. 새로고침하면 최신 화면으로 보입니다.</span>
  <button type="button" id="updateReload">새로고침</button>
</div>

<div id="gate">
  <div class="spinner" id="gate-spinner"></div>
  <p id="gate-msg">확인 중...</p>
  <div id="gate-fail" hidden>
    <p class="gate-detail" id="gate-detail"></p>
    <div class="gate-actions">
      <button class="btn solid" onclick="location.reload()">다시 시도</button>
      <button class="ghost" onclick="gateRelogin()">로그인 화면으로</button>
    </div>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand">면접<em>ON</em></div>
      <span class="grow"></span>
      <span class="ub-name" id="t-user-name"></span>
      <span class="ub-role" id="t-user-role"></span>
      <a class="ghost" id="admin-link" href="../admin/" style="text-decoration:none" hidden>명단 관리</a>
      <button class="ghost" onclick="teacherLogout()">로그아웃</button>
    </div>
  </header>

  <main class="wrap">

    <!-- ══ 1. 학생 고르기 ══ -->
    <section id="view-pick">
      <div class="panel pad">
        <p class="sec">면접할 학생 고르기</p>
        <p class="hint">반을 고르거나 <b>학번·이름</b>으로 찾아 <b>줄을 누르세요</b>. 전교생이 다 보입니다.</p>

        <input type="text" id="search" placeholder="학번이나 이름으로 찾기" oninput="onSearch(this)">
        <div class="chips" id="class-chips" style="margin-top:14px" hidden></div>

        <p class="sec" style="margin-top:4px">찾은 학생 <span id="found-count"></span></p>
        <div id="student-list"></div>
      </div>
    </section>

    <!-- ══ 2. 질문 정하기 ══ -->
    <section id="view-setup" hidden>
      <div class="panel pad">
        <div class="headline">
          <div>
            <p class="sec" style="margin:0">면접 준비</p>
            <h2 id="target-name"></h2>
          </div>
          <button class="ghost" onclick="backToPick()">← 다른 학생</button>
        </div>

        <p class="sec" style="margin-top:20px">지난 면접</p>
        <div id="history"></div>

        <p class="sec" style="margin-top:22px">낼 질문</p>
        <p class="hint">
          질문마다 <b>무엇을 보는 질문인지</b> 골라 두세요. 면접이 끝나면 역량별로 모아 보여줍니다.
        </p>
        <div id="q-list"></div>

        <div class="btnrow" style="margin-top:12px">
          <button class="btn" onclick="addQuestion('', '기타')">＋ 직접 적기</button>
          <button class="ghost" onclick="loadCommon('changche', '공동체역량')">창체 질문 3개</button>
          <button class="ghost" onclick="loadCommon('major', '진로역량')">전공 질문 3개</button>
        </div>

        <button class="btn solid wide" id="btn-start" onclick="startInterview()" disabled>면접 시작</button>
      </div>
    </section>

    <!-- ══ 3. 면접 진행 ══ -->
    <section id="view-run" hidden>
      <div class="panel pad">
        <div class="headline">
          <div>
            <p class="sec" style="margin:0"><span id="run-who"></span></p>
            <span class="pill teacher" id="run-comp"></span>
          </div>
          <span class="step-no" id="run-step"></span>
        </div>

        <div class="qcard" id="run-question"></div>

        <div class="timerbox">
          <div class="timer" id="timer">00:00</div>
          <button class="btn solid" id="btn-timer" onclick="toggleTimer()">답변 시작</button>
        </div>

        <p class="sec" style="margin-top:22px">들으면서 누르세요</p>
        <div id="tag-area"></div>

        <button class="btn solid wide" id="btn-next" onclick="nextQuestion()">다음 질문 →</button>
      </div>
    </section>

    <!-- ══ 4. 끝내기 ══ -->
    <section id="view-finish" hidden>
      <div class="panel pad">
        <p class="sec">면접 마무리</p>
        <h2 id="finish-who"></h2>
        <p class="hint">전체 답변 시간 <b id="finish-total"></b></p>

        <p class="sec" style="margin-top:20px">학업역량</p>
        <div class="chips" id="grade-academic"></div>
        <p class="sec">진로역량</p>
        <div class="chips" id="grade-career"></div>
        <p class="sec">공동체역량</p>
        <div class="chips" id="grade-community"></div>

        <p class="sec" style="margin-top:20px">한 줄 총평 <span class="opt">(안 써도 됩니다)</span></p>
        <textarea id="finish-note" style="min-height:70px" placeholder="예: 경험은 풍부한데 결론을 먼저 말하는 연습이 필요합니다."></textarea>

        <div class="note info">
          <b>면접 끝내기</b>를 누르면 그 자리에서 학생 폰에 리포트가 보입니다.
        </div>
        <button class="btn solid wide" id="btn-finish" onclick="finishInterview()">면접 끝내기 (학생에게 공개)</button>
      </div>
    </section>

  </main>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/update-bar.js"></script>
<script src="../assets/js/teacher-app.js"></script>
<script>
  function gateFail(msg, detail) {
    clearTimeout(gateTimer);
    document.getElementById('gate-spinner').hidden = true;
    document.getElementById('gate-msg').textContent = msg;
    document.getElementById('gate-detail').textContent = detail || '';
    document.getElementById('gate-fail').hidden = false;
  }

  async function gateRelogin() {
    try { await sb.auth.signOut(); } catch (e) { /* 이미 못 쓰는 상태면 그냥 넘어갑니다 */ }
    try { localStorage.clear(); } catch (e) { /* 사생활 보호 모드면 막힐 수 있습니다 */ }
    location.replace('../');
  }

  var gateTimer = setTimeout(function () {
    gateFail('서버가 답하지 않습니다.',
      '10초를 기다렸지만 응답이 없습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');
  }, 10000);

  // 선생님·관리자 전용입니다. 학생이면 학생 앱으로 돌려보냅니다.
  // (서버의 RLS 가 진짜 방어선이고, 이건 화면을 잘못 연 사람을 안내하는 용도입니다)
  (async function guard() {
    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      gateFail('앱을 불러오지 못했습니다.',
        'supabase 라이브러리(cdn.jsdelivr.net)를 못 읽었습니다. 인터넷 연결을 확인해 주세요.');
      return;
    }
    var ready = false;
    try { ready = !!sb; } catch (e) { ready = false; }
    if (!ready) {
      gateFail('앱을 불러오지 못했습니다.',
        'assets/js/config.js 를 못 읽었습니다. 파일 경로를 확인해 주세요.');
      return;
    }

    const { data: { session }, error: sessionErr } = await sb.auth.getSession();
    if (sessionErr) { gateFail('로그인 정보를 읽지 못했습니다.', sessionErr.message); return; }
    if (!session) { clearTimeout(gateTimer); location.replace('../'); return; }

    const { data: profile, error: profileErr } = await sb
      .from('profiles')
      .select('name, login_id, role')
      .eq('id', session.user.id)
      .maybeSingle();

    if (profileErr) {
      gateFail('계정 정보를 읽지 못했습니다.',
        profileErr.message + ' — 서버의 profiles 권한(RLS) 설정을 확인해야 할 수 있습니다.');
      return;
    }

    if (!profile || profile.role === 'student') { clearTimeout(gateTimer); location.replace('../'); return; }

    clearTimeout(gateTimer);

    me = { id: session.user.id, name: profile.name || profile.login_id || '', role: profile.role };
    document.getElementById('t-user-name').textContent = me.name;
    document.getElementById('t-user-role').textContent = profile.role === 'admin' ? '관리자' : '교사';
    // 명단 관리는 관리자만 합니다. 교사에게는 이 길이 아예 없습니다.
    if (profile.role === 'admin') document.getElementById('admin-link').hidden = false;

    document.getElementById('gate').hidden = true;
    document.getElementById('app').hidden = false;

    loadStudents();
  })().catch(function (e) {
    console.error(e);
    var detail = String((e && e.message) || e);
    if (document.getElementById('app').hidden) gateFail('확인 중 문제가 생겼습니다.', detail);
    else if (typeof toast === 'function') toast('문제가 생겼습니다: ' + detail, 'bad');
  });

  async function teacherLogout() {
    await sb.auth.signOut();
    location.replace('../');
  }
</script>
</body>
</html>
