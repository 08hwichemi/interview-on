<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>면접ON 마이크 시험</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    /* 휴대폰에서 «녹음» 과 «받아 적기(음성 인식)» 가 동시에 되는지 시험하는 한 장짜리 페이지 (2026-10-13).
       선생님 말씀: 학생 앱 면접 훈련은 녹음을 폰에 잠깐 저장하는데, 녹음하면서 글로 바꾸기도 동시에 되나? — 시험해 보고 안 되면 버리자.
       로그인 없이 열리고, 서버에 아무것도 보내지 않습니다(녹음은 이 폰 안에서만, 받아 적기는 브라우저 음성 인식 = 구글 · 애플). */
    :root{ --ground:#FAFAF9; --surface:#FFFFFF; --surface-2:#F4F4F2; --line:#E7E5E2; --line-2:#D6D3CE;
      --ink:#18181B; --ink-2:#52525B; --ink-3:#8A8A93; --ok:#2B8A3E; --ok-soft:#E6F4EA; --bad:#9B2C2C; --bad-soft:#FBEAEA;
      --amber:#8A5A0E; --amber-soft:#FBF1DE; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--ground);color:var(--ink);
      font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
    .wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
    .brand{font-weight:800;font-size:18px;margin:0 0 14px}
    .brand em{font-style:normal;color:var(--ink-3)}
    h1{font-size:24px;margin:0 0 6px;letter-spacing:-.03em}
    .lead{color:var(--ink-2);margin:0 0 16px;font-size:15px}
    .order{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
    .order label{flex:1 1 100%;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:14px;background:var(--surface);display:flex;gap:6px;align-items:center}
    button{font:inherit;cursor:pointer}
    .go{width:100%;border:0;border-radius:14px;padding:18px;font-size:20px;font-weight:800;color:#fff;background:#E8590C}
    .go.stop{background:var(--bad)}
    .go[disabled]{opacity:.5}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0 0}
    .card h2{font-size:14px;margin:0 0 6px;color:var(--ink-3);letter-spacing:.04em}
    .said{min-height:90px;white-space:pre-wrap;word-break:keep-all}
    .said .tmp{color:var(--ink-3)}
    .said .empty{color:var(--ink-3)}
    .state{font-size:14px;color:var(--ink-2)}
    .rows{margin:0;padding:0;list-style:none}
    .rows li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
    .rows li:first-child{border-top:0}
    .rows b{flex:0 0 76px}
    .tag{display:inline-block;border-radius:6px;padding:0 8px;font-weight:700;font-size:14px}
    .tag.ok{background:var(--ok-soft);color:var(--ok)}
    .tag.bad{background:var(--bad-soft);color:var(--bad)}
    .tag.mid{background:var(--amber-soft);color:var(--amber)}
    .verdict{font-size:19px;font-weight:800;margin:4px 0 8px}
    audio{width:100%;margin:8px 0 0}
    .copy{border:1px solid var(--ink);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;width:100%;margin:12px 0 0}
    .note{font-size:13.5px;color:var(--ink-3);margin:14px 0 0}
  </style>
</head>
<body>
<div class="wrap">
  <p class="brand">면접<em>ON</em></p>
  <h1>🎤 녹음 + 받아 적기 동시 시험</h1>
  <p class="lead">휴대폰에서 <b>녹음</b>과 <b>받아 적기(말 → 글)</b>가 동시에 되는지 봅니다.
    «시작» 을 누르고 <b>20초쯤 아무 말이나</b> 한 뒤 «멈춤». 마이크를 물으면 «허용». 서버에는 아무것도 저장되지 않습니다.</p>

  <div class="order" role="radiogroup" aria-label="켜는 순서">
    <label><input type="radio" name="order" value="rec" checked> 녹음 먼저 켜기 <span class="state">— 학생 앱과 같은 순서</span></label>
    <label><input type="radio" name="order" value="sr"> 받아 적기 먼저 켜기</label>
  </div>

  <button class="go" id="go" onclick="toggle()">▶ 시작</button>

  <div class="card">
    <h2>받아 적힌 글 <span class="state" id="sr-state"></span></h2>
    <div class="said" id="said"><span class="empty">시작하고 말하면 여기에 글이 뜹니다.</span></div>
  </div>

  <div class="card" id="result" hidden>
    <h2>결과</h2>
    <p class="verdict" id="verdict"></p>
    <ul class="rows" id="rows"></ul>
    <audio id="player" controls hidden></audio>
    <button class="copy" onclick="copyResult()">📋 결과 복사 (선생님께 보내기)</button>
  </div>

  <p class="note">같은 폰에서 «받아 적기 먼저 켜기» 로도 한 번 더 해 보세요 — 켜는 순서에 따라 결과가 달라지는 폰도 있습니다.
    카톡 · 네이버 앱 안에서 열었다면 크롬(갤럭시) · 사파리(아이폰)로 다시 열어 주세요.</p>
</div>

<script>
  var R = null;   // 이번 시험의 기록

  function srCtor() { return window.SpeechRecognition || window.webkitSpeechRecognition || null; }

  // 기종 · 브라우저를 사람이 읽는 말로
  function device() {
    var u = navigator.userAgent;
    var os = /iPhone|iPad/.test(u) ? '아이폰/아이패드' : /Android/.test(u) ? '안드로이드' : /Windows/.test(u) ? '윈도우' : /Mac/.test(u) ? '맥' : '기타';
    var br = /SamsungBrowser/.test(u) ? '삼성 인터넷' : /KAKAOTALK/i.test(u) ? '카톡 안 브라우저' : /NAVER/.test(u) ? '네이버 앱'
           : /Edg\//.test(u) ? '엣지' : /CriOS|Chrome\//.test(u) ? '크롬' : /Safari\//.test(u) ? '사파리' : /Firefox|FxiOS/.test(u) ? '파이어폭스' : '기타';
    var m = u.match(/Android [\d.]+; ([^;)]+)/);
    return os + ' · ' + br + (m ? ' · ' + m[1].trim() : '');
  }

  function paintSaid() {
    var box = document.getElementById('said');
    if (!R || (!R.text && !R.tmp)) { box.innerHTML = '<span class="empty">' + (R && R.running ? '말해 보세요…' : '시작하고 말하면 여기에 글이 뜹니다.') + '</span>'; return; }
    box.textContent = R.text;
    if (R.tmp) { var s = document.createElement('span'); s.className = 'tmp'; s.textContent = ' ' + R.tmp; box.appendChild(s); }
  }
  function srState(t) { document.getElementById('sr-state').textContent = t ? '— ' + t : ''; }

  async function toggle() { if (R && R.running) stop(); else start(); }

  async function start() {
    R = { running: true, text: '', tmp: '', srErrors: [], srStarts: 0, recError: '', chunks: [], startedAt: Date.now(), order: document.querySelector('input[name=order]:checked').value };
    document.getElementById('result').hidden = true;
    var go = document.getElementById('go');
    go.disabled = true;
    paintSaid();
    if (R.order === 'sr') { startSR(); await startRec(); } else { await startRec(); startSR(); }
    go.disabled = false;
    go.textContent = '■ 멈춤';
    go.classList.add('stop');
  }

  // ── 녹음 — 학생 앱(interview.js startActualInterview)과 같은 방식 ──
  async function startRec() {
    try {
      R.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      R.rec = new MediaRecorder(R.stream);
      R.rec.ondataavailable = function (e) { if (e.data && e.data.size) R.chunks.push(e.data); };
      R.rec.start(1000);
    } catch (e) {
      R.recError = (e && (e.name + ' ' + (e.message || ''))) || String(e);
    }
  }

  // ── 받아 적기 — 선생님 화면(listen.js)과 같은 방식: 조용하면 크롬이 스스로 멈추니 다시 켭니다 ──
  function startSR() {
    var C = srCtor();
    if (!C) { srState('이 브라우저에는 받아 적기가 없습니다'); return; }
    var sr;
    try { sr = new C(); } catch (e) { R.srErrors.push('만들기 실패'); return; }
    sr.lang = 'ko-KR'; sr.continuous = true; sr.interimResults = true;
    sr.onresult = function (ev) {
      var tmp = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var t = (ev.results[i][0] && ev.results[i][0].transcript) || '';
        if (ev.results[i].isFinal) R.text = (R.text ? R.text + ' ' : '') + t.trim(); else tmp += t;
      }
      R.tmp = tmp;
      srState('받아 적는 중');
      paintSaid();
    };
    sr.onerror = function (ev) {
      var k = (ev && ev.error) || '?';
      if (k !== 'no-speech' && k !== 'aborted') R.srErrors.push(k);
      if (k === 'not-allowed' || k === 'service-not-allowed') R.srStop = true;   // 막혔으면 다시 켜 봐야 소용없음
      srState('오류: ' + k);
    };
    sr.onend = function () {
      if (R.tmp) { R.text = (R.text ? R.text + ' ' : '') + R.tmp.trim(); R.tmp = ''; paintSaid(); }
      if (R.running && !R.srStop && R.sr === sr && R.srStarts < 30) setTimeout(function () { if (R.running && R.sr === sr) { try { sr.start(); R.srStarts++; } catch (e) { /* */ } } }, 200);
    };
    R.sr = sr;
    try { sr.start(); R.srStarts++; srState('듣는 중'); } catch (e) { R.srErrors.push('시작 실패: ' + e.message); }
  }

  function stop() {
    R.running = false;
    R.seconds = Math.round((Date.now() - R.startedAt) / 1000);
    var go = document.getElementById('go');
    go.textContent = '▶ 다시 시작'; go.classList.remove('stop');
    if (R.sr) { try { R.sr.stop(); } catch (e) { /* */ } }
    srState('');
    if (R.rec && R.rec.state !== 'inactive') {
      R.rec.onstop = function () { finish(); };
      try { R.rec.stop(); } catch (e) { finish(); }
    } else finish();
    if (R.stream) R.stream.getTracks().forEach(function (t) { t.stop(); });
  }

  // 녹음 파일에 소리가 들어갔는지 — 파일을 풀어서 가장 큰 소리를 잽니다(0 이면 무음)
  async function loudness(blob) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC();
      var buf = await new Promise(function (ok, no) { blob.arrayBuffer().then(function (ab) { ctx.decodeAudioData(ab, ok, no); }, no); });
      var d = buf.getChannelData(0), peak = 0;
      for (var i = 0; i < d.length; i += 64) { var v = Math.abs(d[i]); if (v > peak) peak = v; }
      ctx.close && ctx.close();
      return { peak: peak, secs: Math.round(buf.duration) };
    } catch (e) { return null; }
  }

  async function finish() {
    var blob = R.chunks.length ? new Blob(R.chunks, { type: R.chunks[0].type || 'audio/mp4' }) : null;
    var player = document.getElementById('player');
    player.hidden = !blob;
    if (blob) player.src = URL.createObjectURL(blob);
    var L = blob ? await loudness(blob) : null;

    var hasSR = !!srCtor();
    var srOk = R.text.trim().length >= 2;
    var recOk = !!blob && blob.size > 1000 && (!L || L.peak > 0.02);
    var recNote = R.recError ? '안 됨 — ' + R.recError
      : !blob ? '안 됨 — 녹음 파일이 비었습니다'
      : L && L.peak <= 0.02 ? '파일은 있지만 소리가 거의 없음(무음) · ' + (L.secs || R.seconds) + '초'
      : '됨 · ' + ((L && L.secs) || R.seconds) + '초 · ' + Math.round(blob.size / 1024) + 'KB' + (L ? ' · 소리 크기 ' + Math.round(L.peak * 100) : '') + ' — 아래 ▶ 로 들어 보세요';
    var srNote = !hasSR ? '이 브라우저에는 없음'
      : srOk ? '됨 · ' + R.text.replace(/\s/g, '').length + '자'
      : '안 됨' + (R.srErrors.length ? ' — 오류: ' + countErrors(R.srErrors) : ' — 글이 하나도 안 나옴');
    R.verdict = recOk && srOk ? '✅ 동시에 됩니다' : recOk ? '🎙️ 녹음만 됩니다' : srOk ? '📝 받아 적기만 됩니다' : '❌ 둘 다 안 됩니다';
    R.lines = [
      ['기기', device()],
      ['켠 순서', R.order === 'sr' ? '받아 적기 먼저' : '녹음 먼저'],
      ['녹음', recNote],
      ['받아 적기', srNote]
    ];
    document.getElementById('verdict').textContent = R.verdict;
    document.getElementById('rows').innerHTML = R.lines.map(function (l, i) {
      var cls = i === 2 ? (recOk ? 'ok' : 'bad') : i === 3 ? (srOk ? 'ok' : hasSR ? 'bad' : 'mid') : '';
      var v = cls ? '<span class="tag ' + cls + '">' + (i === 2 ? (recOk ? '됨' : '안 됨') : (srOk ? '됨' : hasSR ? '안 됨' : '없음')) + '</span> ' : '';
      return '<li><b>' + l[0] + '</b><span>' + v + esc(cls ? l[1].replace(/^(됨|안 됨) ?(· |— )?/, '') : l[1]) + '</span></li>';
    }).join('');
    document.getElementById('result').hidden = false;
    paintSaid();
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 같은 오류가 다시 켤 때마다 되풀이되므로 «audio-capture ×12» 처럼 묶습니다
  function countErrors(list) {
    var n = {};
    list.forEach(function (k) { n[k] = (n[k] || 0) + 1; });
    return Object.keys(n).map(function (k) { return k + (n[k] > 1 ? ' ×' + n[k] : ''); }).join(', ');
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  async function copyResult() {
    if (!R || !R.lines) return;
    var t = '[면접ON 마이크 시험] ' + R.verdict + '\n' + R.lines.map(function (l) { return l[0] + ': ' + l[1]; }).join('\n') +
            '\n받아 적힌 글: ' + (R.text || '(없음)').slice(0, 120);
    try { await navigator.clipboard.writeText(t); alert('복사했습니다. 카톡 등에 붙여 넣어 보내 주세요.'); }
    catch (e) { prompt('아래 글을 길게 눌러 복사하세요.', t); }
  }
</script>
</body>
</html>
